<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>IIT JEE Registration Form</legend>
        <label for="fname">Full Name:</label>
        <input type="text" id="fname" name="fname">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>
        <label for="pass">Password</label>
        <input type="password" id="pass" name="password">
        <br><br>
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Others</label>
        <br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>
        <label for="sname">School Name:</label>
        <input type="text" id="sname" name="sclname">
        <br><br>
        <label for="board">Board:</label>
        <select  id="board">
            <option  selected disabled>Select Your Board</option>
            <option value="wb">WB</option>
            <option value="cbsc">CBSC</option>
            <option value="icsc">ICSC</option>
        </select>
        <br><br>
        <label for="yop">Year of Passing: </label>
        <input type="date" id="yop" name="yop">
        <br><br>
        <label for="ec">Exam-Center:</label>
        <select  id="ec">
            <option value="kol">Kolkata</option>
            <option value="slg">Siliguri</option>
            <option value="cob">Coochbehar</option>
        </select>
        <br><br>
        <button>Register</button>
    </fieldset>
</body>
</html>
